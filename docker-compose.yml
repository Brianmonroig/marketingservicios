services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-app-user.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb -p local/crm || true;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_MIGRATE_URL: postgres://postgres:postgres@postgres:5432/crm
      DATABASE_URL: postgres://app_user:app_user@postgres:5432/crm
      JWT_SECRET: dev-only-change-me-please-32chars
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      WEB_ORIGIN: http://localhost:3000
      PORT: "3001"
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      AUTH_SECRET: dev-only-change-me-please-32chars
      AUTH_TRUST_HOST: "true"
      API_URL: http://api:3001
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
