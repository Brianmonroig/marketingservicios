name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_MIGRATE_URL: postgres://postgres:postgres@localhost:5432/crm
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/crm
      JWT_SECRET: test-secret-test-secret-test-secret
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      API_URL: http://localhost:3001
      AUTH_SECRET: test-secret-test-secret-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Crear el usuario de la aplicación
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d crm -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_user') THEN
              CREATE ROLE app_user LOGIN PASSWORD 'app_user' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END
          $$;
          GRANT CONNECT ON DATABASE crm TO app_user;
          SQL
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/shared build
      - run: pnpm --filter @crm/api db:migrate
      - run: pnpm lint
      - run: pnpm --filter @crm/api test
      - run: pnpm --filter @crm/web build
